services:
  # ==========================================
  # NUEVA INFRAESTRUCTURA (TAREA 2)
  # ==========================================
  
  # 1. El Jefe Coordinador
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"

  # 2. La Oficina de Correos
  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ¡AQUÍ AGREGAMOS EL TÓPICO DE REINTENTOS!
      KAFKA_CREATE_TOPICS: "consultas_topic:3:1,reintentos_topic:3:1,dlq_topic:1:1"
    depends_on:
      - zookeeper

  # ==========================================
  # INFRAESTRUCTURA TAREA 1 (RECICLADA)
  # ==========================================
  
  # 1. Base de Datos en Memoria (Redis)
  redis_db:
    image: redis:alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  # 2. El Cerebro: Generador de Respuestas
  response_generator:
    build: ./response_generator
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  # 3. El Portero: Sistema de Caché
  cache_system:
    build: ./cache_system
    ports:
      - "8000:8000"
    depends_on:
      - redis_db
      - response_generator
      - kafka
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # 4. El Atacante: Generador de Tráfico
  traffic_generator:
    build: ./traffic_generator
    depends_on:
      - kafka
    command: tail -f /dev/null
      
  # 5. El Trabajador: Consumidor Kafka
  kafka_consumer:
    build: ./kafka_consumer
    depends_on:
      - kafka
      - cache_system
    volumes:
      - ./kafka_consumer:/app  # <--- ¡AQUÍ ESTÁ EL TÚNEL CORRECTO!